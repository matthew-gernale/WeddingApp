<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mr. and Mrs. Gernale</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="tailwind.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="WeddingApp.Client.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#8b3a3a" />
    <meta name="description" content="Join us for the wedding of Matthew Gernale and Erika Joyce Gatchalian on October 8, 2026." />
    <script type="importmap"></script>
</head>

<body class="no-select">
    <div id="app">
        <div class="wedding-loader">
            <div class="wedding-logo-wrapper">
                <img src="images/logo/me-logo-red.png"
                    alt="Wedding logo"
                    class="wedding-logo" />
            </div>

            <div class="loading-text">
                Loading<span class="loading-dots"></span>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        Blazor.start().then(() => {
            const loader = document.querySelector(".wedding-loader");

            if (loader) {
                loader.classList.add("loader-fade-out");

                setTimeout(() => {
                    loader.remove();
                }, 700);
            }
        });
    </script>
    <script src="js/hero.js"></script>
    <script src="js/rsvp.js"></script>
    <script src="js/clipboard.js"></script>
    <script src="js/scroll.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
